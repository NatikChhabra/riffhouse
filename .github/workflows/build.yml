name: Build

# Writing and the website are not built here. (GitHub does not apply path filters to tags.)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version, tag and changelog agree
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/release/notes.py check "$GITHUB_REF_NAME"

  # Publishing a release makes the tag, and people then wait for the installer. When main already
  # built this very commit as this very version, and every check passed, that installer is used
  # and the release is complete in about a minute. Anything else is built from scratch as before.
  reuse:
    name: Use the build main already made
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "found=false" >> "$GITHUB_OUTPUT"
          want="${GITHUB_REF_NAME#v}"
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --event push \
                  --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -z "$run" ]; then echo "main has no finished build of $GITHUB_SHA: building now."; exit 0; fi
          if ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --name riffhouse-windows --dir dist; then
            echo "The installer of run $run could not be fetched: building now."; rm -rf dist; exit 0
          fi
          made=$(tr -d '\r' < dist/BUILD.txt 2>/dev/null || true)
          if [ "$made" != "$want $GITHUB_SHA" ]; then
            echo "Run $run made '$made', not '$want $GITHUB_SHA': building now."; rm -rf dist; exit 0
          fi
          file="dist/Riffhouse-$want-windows-setup.exe"
          hash=$(sha256sum "$file" | cut -d' ' -f1)
          if ! grep -qi "$hash" dist/SHA256SUMS.txt; then
            echo "The installer of run $run does not match its checksum: building now."; rm -rf dist; exit 0
          fi
          echo "Using the installer run $run built and tested: $file $hash"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.find.outputs.found == 'true'
        with:
          name: riffhouse-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/BUILD.txt
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.found != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The ASIO SDK is GPLv3 since October 2025. MSYS2 packages its headers.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-asiosdk

      - name: Locate the ASIO SDK
        shell: pwsh
        run: |
          $sdk = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\include\asiosdk"
          if (-not (Test-Path (Join-Path $sdk "common\asio.h"))) { throw "ASIO SDK headers not found at $sdk" }
          "ASIO_SDK=$($sdk -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append

      # A tag build carries the tag as its version ("0.1.0-rc2"), so a tester can say which copy they run.
      # On main, a commit whose version has no tag yet is the one that may become that release, so it is
      # built as the release. Later commits, once the tag exists, are marked as built from source again.
      - name: Configure
        shell: pwsh
        env:
          # where reports go after a player says yes; empty on forks and pull requests
          RIFFHOUSE_REPORT_URL: ${{ secrets.REPORT_URL }}
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Riffhouse VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $label = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") { $label = $env:GITHUB_REF_NAME -replace '^v', '' }
          elseif ($env:GITHUB_REF -eq "refs/heads/main" -and $env:GITHUB_EVENT_NAME -eq "push") {
            $tagged = git ls-remote --tags origin "refs/tags/v$v"
            if ($LASTEXITCODE -eq 0 -and -not $tagged) { $label = $v }
          }
          "Building as '$label' (empty: built from source)"
          "LABEL=$label" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRIFFHOUSE_ASIO_SDK_DIR="${{ env.ASIO_SDK }}" "-DRIFFHOUSE_VERSION_LABEL=$label"

      - name: Build
        env:
          # CMake can configure again during the build; it keeps the relay from the first run
          RIFFHOUSE_REPORT_URL: ${{ secrets.REPORT_URL }}
        run: cmake --build build --config Release --parallel --target Riffhouse_Standalone Riffhouse_VST3 riffhouse_tests

      # A release that can't reach the relay sends no reports and no weekly count, and nothing
      # in the app says so. 0.1.5.2 shipped that way; this stops the next one.
      - name: The app knows where reports go
        shell: pwsh
        env:
          RIFFHOUSE_REPORT_URL: ${{ secrets.REPORT_URL }}
        run: |
          if (-not $env:RIFFHOUSE_REPORT_URL) { "No relay on this build (fork or outside pull request)"; exit 0 }
          $relayHost = ([uri]$env:RIFFHOUSE_REPORT_URL.Trim()).Host
          $bad = $false
          foreach ($f in @(Get-ChildItem build -Recurse -Include Riffhouse.exe, Reports.obj -ErrorAction SilentlyContinue)) {
            $has = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f.FullName)).Contains($relayHost)
            "$($f.FullName.Substring($PWD.Path.Length)): $(if ($has) { 'has the relay' } else { 'NO relay' })"
            if (-not $has -and $f.Name -eq 'Riffhouse.exe') { $bad = $true }
          }
          if ($bad) { throw "Riffhouse.exe was built without the relay address" }
          $label = (Select-String -Path build\CMakeCache.txt -Pattern '^RIFFHOUSE_VERSION_LABEL:STRING=(.*)$').Matches[0].Groups[1].Value
          if ($label) {
            $exe = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("build\src\Riffhouse_artefacts\Release\Standalone\Riffhouse.exe"))
            if (-not $exe.Contains($label)) { throw "Riffhouse.exe does not carry its version label $label" }
            "Version label $label is in the app"
          }

      - name: Test the sound engine
        run: build\tests\riffhouse_tests_artefacts\Release\riffhouse_tests.exe

      # What the app's update check gets from the real releases page on Windows, and what it makes of it.
      # It only reports: the network is not ours to fail a build on.
      - name: Ask the releases page what the app asks
        run: build\tests\riffhouse_tests_artefacts\Release\riffhouse_tests.exe live-update

      - name: Read the version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Riffhouse VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$PWD\build\src\Riffhouse_artefacts\Release" packaging\riffhouse.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $file = "dist\Riffhouse-$env:VERSION-windows-setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "SHA-256 Riffhouse-$env:VERSION-windows-setup.exe $hash" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
          # which version this was built as and from which commit: a release only reuses its own build
          "$env:LABEL $env:GITHUB_SHA" | Out-File -FilePath dist\BUILD.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: riffhouse-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/BUILD.txt
          if-no-files-found: error

      # The debug symbols of exactly this build: a player's crash dump read with them names the function.
      - uses: actions/upload-artifact@v4
        with:
          name: riffhouse-windows-symbols
          path: build/src/Riffhouse_artefacts/Release/Standalone/*.pdb
          if-no-files-found: warn
          retention-days: 90

      # A player who already has 0.1.4: their own tones, favourites, recordings and songs, and the
      # settings 0.1.4 writes. The new installer goes over that copy, and later the uninstaller
      # takes it off. Neither may touch a file the player made (plan-0.1.5 lines 12 and 13).
      - name: Put 0.1.4 and a player's own files on this machine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $music = [Environment]::GetFolderPath('MyMusic')
          $tone = Get-Content presets\80s-arena-lead.json -Raw | ConvertFrom-Json
          $tone.name = 'Upgrade Check Tone'
          $files = @{
            (Join-Path $docs 'Riffhouse\Presets\Upgrade Check Tone.json') = ($tone | ConvertTo-Json -Depth 10)
            (Join-Path $docs 'Riffhouse\Songs\Upgrade Check Song.txt') = "[Verse]`nA5 D5 E5`n"
          }
          foreach ($f in $files.Keys) { New-Item -ItemType Directory -Force (Split-Path $f) | Out-Null; Set-Content -Path $f -Value $files[$f] -Encoding utf8 -NoNewline }
          # a real take: one second of a quiet 220 Hz tone, 48 kHz, 16-bit mono
          $take = Join-Path $music 'Riffhouse Recordings\Upgrade Check Take.wav'
          New-Item -ItemType Directory -Force (Split-Path $take) | Out-Null
          $n = 48000; $ms = New-Object IO.MemoryStream; $w = New-Object IO.BinaryWriter($ms)
          $w.Write([Text.Encoding]::ASCII.GetBytes('RIFF')); $w.Write([int](36 + 2 * $n)); $w.Write([Text.Encoding]::ASCII.GetBytes('WAVEfmt '))
          $w.Write([int]16); $w.Write([int16]1); $w.Write([int16]1); $w.Write([int]48000); $w.Write([int]96000); $w.Write([int16]2); $w.Write([int16]16)
          $w.Write([Text.Encoding]::ASCII.GetBytes('data')); $w.Write([int](2 * $n))
          for ($i = 0; $i -lt $n; $i++) { $w.Write([int16](3000 * [Math]::Sin(2 * [Math]::PI * 220 * $i / 48000))) }
          [IO.File]::WriteAllBytes($take, $ms.ToArray())
          $files[$take] = ''
          # what each file must still hold at the end
          $files.Keys | ForEach-Object { "$_|$((Get-FileHash $_ -Algorithm SHA256).Hash)" } | Out-File player-files.txt -Encoding utf8
          Get-Content player-files.txt

          # the real 0.1.4 installer from the releases page, installed and run the way a player has it
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/NatikChhabra/riffhouse/releases/tags/v0.1.4' -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $rel.assets | Where-Object { $_.name -like '*windows-setup.exe' } | Select-Object -First 1
          if (-not $asset) { throw "The 0.1.4 release has no Windows installer" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile old-setup.exe
          $p = Start-Process old-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$PWD\old-install.log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The 0.1.4 installer did not finish in 5 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content old-install.log -Tail 40; throw "The 0.1.4 installer ended with code $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Riffhouse\Riffhouse.exe'
          "Installed $((Get-Item $app).VersionInfo.ProductVersion) from the releases page"
          $p = Start-Process $app -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 15
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) { $p.Kill() }
          # 0.1.4 updates itself as it closes once a newer release is out: let that finish too
          foreach ($i in 1..180) { if (-not (Get-Process | Where-Object { $_.ProcessName -like '*windows-setup*' })) { break }; Start-Sleep -Seconds 1 }
          $settings = Join-Path $env:APPDATA 'Riffhouse\Riffhouse.settings'
          if (-not (Test-Path $settings)) { throw "0.1.4 kept no settings file" }
          "0.1.4 ran and wrote its settings ($((Get-Item $settings).Length) bytes)"

      # The installer is what people get, so it is what gets tested: put it on this machine
      # the way an update does, start the app, have it draw every screen, and take it off again.
      - name: Install it, start it, remove it
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*windows-setup.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$PWD\install.log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The installer did not finish in 5 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "The installer ended with code $($p.ExitCode)" }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\Riffhouse\Riffhouse.exe'
          $plugin = Join-Path $env:LOCALAPPDATA 'Programs\Common\VST3\Riffhouse.vst3'
          if (-not (Test-Path $app)) { Get-Content install.log -Tail 40; throw "Riffhouse.exe was not installed" }
          if (-not (Test-Path $plugin)) { throw "The VST3 plugin was not installed" }
          $licences = Join-Path (Split-Path $app) 'Licences.txt'
          if (-not (Test-Path $licences) -or -not (Select-String -Path $licences -Pattern 'LAME MP3 encoder' -Quiet)) { throw "Licences.txt with every part's licence was not installed" }
          $installed = (Get-Item $app).VersionInfo.ProductVersion
          if (-not "$installed".StartsWith($env:VERSION)) { throw "Installed version is '$installed', expected $env:VERSION" }

          $screens = Join-Path $PWD 'smoke'
          $p = Start-Process $app -ArgumentList '--snapshots',"`"$screens`"",'1' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "The app did not finish drawing its screens in 4 minutes" }
          if ($p.ExitCode -ne 0) { throw "The app ended with code $($p.ExitCode)" }
          $made = @(Get-ChildItem $screens -Recurse -Filter *.png | Where-Object { $_.Length -gt 2000 })
          "The app drew $($made.Count) pictures"
          if ($made.Count -lt 60) { throw "Expected at least 60 screens and gear pictures, got $($made.Count)" }
          if (-not (Test-Path (Join-Path $screens 'rehearsed.txt'))) { throw "The end of a real setup was not gone through" }

          # A real start with the clock running. The window has to keep answering, close when it
          # is asked to, and leave its diary of what it did with the sound card.
          $p = Start-Process $app -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "The app closed by itself within 25 seconds, code $($p.ExitCode)" }
          if (-not $p.Responding) { throw "The app's window does not answer 25 seconds after starting" }
          # Switching to an ASIO driver first starts it in a test run of the same program, beside
          # the open app. That run must start although the app is open, answer and end by itself.
          $probe = Start-Process $app -ArgumentList '--probe-audio','ASIO','"No Such Driver"' -PassThru -RedirectStandardOutput probe.txt
          $null = $probe.Handle
          if (-not $probe.WaitForExit(30000)) { $probe.Kill(); throw "A driver test run did not end within 30 seconds" }
          "Driver test run ended with code $($probe.ExitCode): $(Get-Content probe.txt -Raw)"
          if ($probe.ExitCode -ne 2) { throw "A test run of a driver that is not there should end with code 2, not $($probe.ExitCode)" }
          $p.Refresh()
          if ($p.HasExited) { throw "The open app closed when a driver test run started beside it" }
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "The app did not close within 30 seconds of being asked" }
          if ($p.ExitCode -ne 0) { throw "The app ended with code $($p.ExitCode)" }
          $log = Join-Path $env:APPDATA 'Riffhouse\Riffhouse log.txt'
          if (-not (Test-Path $log)) { throw "The app kept no log of its start" }
          Get-Content $log -Tail 60
          # the window's first sign of life, and how long the start took: shown on the run's page
          $ready = Select-String -Path $log -Pattern 'ready (\d+) ms after starting' | Select-Object -Last 1
          if (-not $ready) { throw "The app never wrote that its window was ready" }
          "Installed app: window ready $($ready.Matches[0].Groups[1].Value) ms after starting" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Select-String -Path $log -Pattern 'stopped answering|Starting is taking more|ended in a crash' -Quiet) { throw "The log says the window froze or the app crashed" }

          # A test build finds the newest release on GitHub during those 25 seconds, fetches it and
          # installs it as it closes, the way a player's copy updates. Let that installer finish
          # first: removing the app underneath it left a fresh copy behind (12 November 2026).
          foreach ($i in 1..180) { if (-not (Get-Process | Where-Object { $_.ProcessName -like '*windows-setup*' })) { break }; Start-Sleep -Seconds 1 }
          if (Get-Process | Where-Object { $_.ProcessName -like '*windows-setup*' }) { throw "The update the app started as it closed did not finish in 3 minutes" }
          $now = (Get-Item $app).VersionInfo.ProductVersion
          if ("$now" -ne "$installed") { "Updated itself on close: $installed to $now" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }

          $player = Get-Content player-files.txt | ForEach-Object { $f, $h = $_ -split '\|'; [pscustomobject]@{ File = $f; Hash = $h } }
          function Test-PlayerFiles ($when)
          {
            foreach ($x in $player)
            {
              if (-not (Test-Path $x.File)) { throw "$when, the player's $($x.File) is gone" }
              if ((Get-FileHash $x.File -Algorithm SHA256).Hash -ne $x.Hash) { throw "$when, the player's $($x.File) was changed" }
            }
            $settings = Join-Path $env:APPDATA 'Riffhouse\Riffhouse.settings'
            if (-not (Test-Path $settings) -or (Get-Item $settings).Length -lt 100) { throw "$when, the settings file is gone or empty" }
            "$when, every file the player made is there, unchanged, and so are the settings"
          }
          Test-PlayerFiles "After installing over 0.1.4 and playing"

          $remove = Join-Path (Split-Path $app) 'unins000.exe'
          if (-not (Test-Path $remove)) { throw "No uninstaller next to the app" }
          Start-Process $remove -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\uninstall.log" -Wait
          $left = $true
          foreach ($i in 1..90) { if (-not (Test-Path $app)) { $left = $false; break }; Start-Sleep -Seconds 1 }
          if ($left)
          {
            # say what held it: a process still running from that folder, and the uninstaller's own account
            Get-Process | Where-Object { $_.Path -and $_.Path -like "*Riffhouse*" } | Format-Table Id, ProcessName, Path -AutoSize | Out-String | Write-Host
            Get-ChildItem (Split-Path $app) -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize | Out-String | Write-Host
            if (Test-Path uninstall.log) { Get-Content uninstall.log -Tail 60 }
            throw "Riffhouse.exe is still there after the uninstaller ran"
          }
          Test-PlayerFiles "After uninstalling"
          "Installed $installed, started, drew its screens, removed."

      # The pictures are only there to look at when something went wrong. A build that passed
      # every check is not failed because GitHub could not store them (11 November 2026: this
      # step hung for ten minutes and failed a build that was green).
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: riffhouse-windows-screens
          path: smoke
          if-no-files-found: ignore

  linux:
    name: Linux build and tests
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.found != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The runner fetches packages from a mirror inside its own cloud first. When that mirror cannot be
      # reached, apt waits on it for every single package (33 minutes on 11 November 2026, and a release
      # waited with it). So: a short first try, then the same again from Ubuntu's own servers only.
      - name: Install build tools
        timeout-minutes: 20
        run: |
          packages="ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev"
          apt="apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120"
          install() { sudo timeout "$1" $apt update && sudo timeout "$1" $apt install -y $packages; }
          if ! install 180; then
            echo "::warning::The runner's package mirror did not answer in 3 minutes. Using archive.ubuntu.com."
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
            sudo dpkg --configure -a || true
            install 600
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target Riffhouse_Standalone riffhouse_tests
      - name: Test the sound engine
        run: build/tests/riffhouse_tests_artefacts/Release/riffhouse_tests

  release:
    name: Publish the release
    needs: [version, reuse, windows, linux]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.version.result == 'success'
          && (needs.reuse.outputs.found == 'true' || (needs.windows.result == 'success' && needs.linux.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: riffhouse-windows
          path: dist
      # The notes are the version's section of CHANGELOG.md, then how to install and the checksum.
      # A tag like v1.2.3-rc1 is published as a pre-release: the app's updater skips those.
      - name: Write the release notes
        run: |
          {
            python3 tools/release/notes.py notes "$GITHUB_REF_NAME"
            echo
            echo "## Install"
            echo
            echo "Download **$(basename dist/*.exe)** below and run it. Riffhouse updates itself after that."
            echo
            echo "Windows may show a blue \"Windows protected your PC\" box the first time, because the installer is not signed with a paid certificate. Press **More info**, then **Run anyway**."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          echo "PRERELEASE=$(python3 tools/release/notes.py prerelease "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          body_path: notes.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generate_release_notes: true
