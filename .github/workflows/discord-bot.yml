name: Discord bot

# Runs the Riff House Discord bot (tools/community/discord_bot.py): posts new releases, beta builds,
# dev log and tone of the week, answers common questions in #help and #bug-reports, and keeps #bot-log.
# Everything it needs to remember is kept in Discord, so a skipped or late run just catches up.
# GitHub often drops scheduled runs (it ran a few times a day instead of every 10 minutes), so each
# run checks every 5 minutes for about 50 minutes, then starts the next run itself. The schedule
# stays as a backup that restarts the chain if it ever breaks.
# PAUSED (Natik, 13 Nov 2026): the bot posts nothing until he says so. Welcomer handles welcomes.
# Manual runs only. To turn it back on, restore the schedule and the "Start the next run" step from git history.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/community
            community
      - name: Run the bot every 5 minutes
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          failed=0
          for i in $(seq 1 10); do
            git fetch -q origin main && git reset -q --hard origin/main || true   # pick up new reels and bot fixes
            timeout 240 python3 tools/community/discord_bot.py || failed=1
            [ "$i" -lt 10 ] && sleep 300
          done
          exit $failed
