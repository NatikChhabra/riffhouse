name: Discord bot

# Runs the Riff House Discord bot (tools/community/discord_bot.py): posts new releases, beta builds,
# dev log and tone of the week, answers common questions in #help and #bug-reports, and keeps #bot-log.
# Everything it needs to remember is kept in Discord, so a skipped or late run just catches up.
# GitHub often drops scheduled runs (it ran a few times a day instead of every 10 minutes), so each
# run checks every 5 minutes for about 50 minutes, then starts the next run itself. The schedule
# stays as a backup that restarts the chain if it ever breaks.
# Posts only (Natik, 13 Nov 2026): releases, dev log, tone of the week, reels and the trailer. No replies to people.
# Runs when something new can be posted instead of on a fast timer:
on:
  # the site (and its feeds: releases, dev log, tone of the week) was just published
  workflow_run:
    workflows: [Website]
    types: [completed]
  # a release was published: the site rebuild that adds it to the feed is started by a bot,
  # which doesn't fire workflow_run, so wait here for the feed instead
  release:
    types: [published]
  # a reel or the trailer was queued
  push:
    branches: [main]
    paths: ['community/reels.json']
  # reels with a post_at time, and a backup if an event is missed
  schedule:
    - cron: '1,31 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/community
            community
      - name: Wait for the release to reach the feed
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://natikchhabra.github.io/riffhouse/feeds/builds.xml?t=$(date +%s)" | grep -q "release-$TAG<" && exit 0
            sleep 30
          done
          echo "::warning::$TAG not in the feed after 10 minutes, the hourly run will catch it"
      - name: Run the bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 tools/community/discord_bot.py
