name: Report relay check

# Run by hand: sends one test report through the relay in the REPORT_URL secret and fails
# unless the relay says it filed it in the private reports repository.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "A published release to check (like v0.1.5.2). Empty: the newest build on main."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Send a test report
    runs-on: ubuntu-24.04
    steps:
      - name: Send it
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: |
          if [ -z "$REPORT_URL" ]; then echo "The REPORT_URL secret is not set"; exit 1; fi
          body='{"key":"riffhouse-1","kind":"report","title":"Relay check","version":"check","body":"Riffhouse: check\nA test sent by the Report relay check workflow. It can be closed."}'
          # no -X POST: the relay answers with a redirect that must be followed with GET, as browsers and Windows do
          # where the answer comes from, without the address itself (it stays a secret in the log)
          # which deployment the secret points at: only the last five letters of its id, enough to tell two apart
          echo "Deployment ends in: $(echo "$REPORT_URL" | sed -E 's#.*/s/[^/]*(.....)/exec.*#\1#')"
          echo "GET: $(curl -sS -o /dev/null -m 60 -w '%{http_code} -> %{redirect_url}' "$REPORT_URL" | sed -E 's#(https://[^/]+)/[^ ]*#\1/...#')"
          echo "POST: $(curl -sS -o /dev/null -m 60 -H 'Content-Type: application/json' --data "$body" -w '%{http_code} -> %{redirect_url}' "$REPORT_URL" | sed -E 's#(https://[^/]+)/[^ ]*#\1/...#')"
          # the safer relay answers junk with a plain sentence and never shows its own error text
          echo "Junk gets: $(curl -sS -L -m 60 -H 'Content-Type: application/json' --data 'not json' "$REPORT_URL")"
          answer=$(curl -sS -L -m 60 -H 'Content-Type: application/json' --data "$body" "$REPORT_URL")
          echo "The relay answered: $answer"
          echo "$answer" | grep -q '"ok":true'

  app:
    name: Send one from the Windows app
    runs-on: windows-2022
    steps:
      - name: Get the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG) {
            "Installer from the $env:TAG release"
            gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p '*windows-setup.exe' -D dist
            exit 0
          }
          $run = gh run list -R $env:GITHUB_REPOSITORY --workflow build.yml --branch main --status success -L 1 --json databaseId,headSha | ConvertFrom-Json
          "Installer from the build of $($run[0].headSha)"
          gh run download $run[0].databaseId -R $env:GITHUB_REPOSITORY -n riffhouse-windows -D dist
      - name: Install it and send a report the way the app does
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*windows-setup.exe -Recurse)[0].FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { throw "The installer did not finish" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Riffhouse\Riffhouse.exe'
          $c = Start-Process $app -ArgumentList '--report-check' -PassThru -RedirectStandardOutput check.txt
          $null = $c.Handle
          if (-not $c.WaitForExit(90000)) { $c.Kill(); throw "The report check did not end in 90 seconds" }
          "The app said: $(Get-Content check.txt -Raw)"
          if ($c.ExitCode -ne 0) { throw "The app could not send its report (code $($c.ExitCode))" }
