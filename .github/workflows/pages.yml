name: Website

# Publishes the site/ folder to GitHub Pages. Nothing is built: the folder is served as it is, with one version stamp added,
# plus the RSS feeds in site/feeds/ that the Riff House Discord reads (releases, beta builds, dev log, weekly tone, riff challenge).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'presets/**'
      - 'tools/community/**'
      - '.github/workflows/pages.yml'
  schedule:
    # Mondays 09:05 UTC: the new tone of the week and riff challenge go out.
    - cron: '5 9 * * 1'
    # Every day, so the dev log picks up changes that did not touch the site.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the Discord feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/community/build_feeds.py site/feeds
      # Browsers keep the stylesheet and script for a while. A new address on every publish makes them fetch the new ones.
      - name: Stamp the stylesheet and script with this version
        run: |
          sed -i "s/href=\"styles\.css\"/href=\"styles.css?v=${GITHUB_SHA::8}\"/; s/src=\"app\.js\"/src=\"app.js?v=${GITHUB_SHA::8}\"/" site/index.html site/roadmap.html
          grep -c "?v=${GITHUB_SHA::8}" site/index.html site/roadmap.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
