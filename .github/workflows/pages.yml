name: Website

# Publishes the site/ folder to GitHub Pages. Nothing is built: the folder is served as it is, with one version stamp added.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers keep the stylesheet and script for a while. A new address on every publish makes them fetch the new ones.
      - name: Stamp the stylesheet and script with this version
        run: |
          sed -i "s/href=\"styles\.css\"/href=\"styles.css?v=${GITHUB_SHA::8}\"/; s/src=\"app\.js\"/src=\"app.js?v=${GITHUB_SHA::8}\"/" site/index.html site/roadmap.html
          grep -c "?v=${GITHUB_SHA::8}" site/index.html site/roadmap.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
