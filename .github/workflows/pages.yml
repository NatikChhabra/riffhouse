name: Website

# Publishes the site/ folder to GitHub Pages. Nothing is built: the folder is served as it is, with one version stamp
# and the newest installer's address written into the download buttons, plus the RSS feeds in site/feeds/ that the Riff House Discord reads (releases, beta builds, dev log, tone of the week).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'presets/**'
      - 'tools/community/**'
      - 'tools/site/check_release.py'
      - 'tools/site/schema.py'
      - 'tools/site/download.py'
      - '.github/workflows/pages.yml'
  schedule:
    # Mondays 09:05 UTC: the new tone of the week goes out.
    - cron: '5 9 * * 1'
    # Every day, so the dev log picks up changes that did not touch the site.
    - cron: '30 15 * * *'
  # A new release: only the check below runs, and says if the site is behind it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Fails, with a list of what to change, when the site still talks about an older version than the newest release.
  # It does not hold the publish back: the site and the feeds still go out. On a release it reads the site as it is on main.
  fresh:
    name: Site matches the newest release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
      - name: Check the site against the newest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/site/check_release.py

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the Discord feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/community/build_feeds.py site/feeds
      # Browsers keep the stylesheet and script for a while. A new address on every publish makes them fetch the new ones.
      - name: Stamp the stylesheet and script with this version
        run: |
          sed -i "s/href=\"styles\.css\"/href=\"styles.css?v=${GITHUB_SHA::8}\"/; s/src=\"app\.js\"/src=\"app.js?v=${GITHUB_SHA::8}\"/" site/*.html
          grep -c "?v=${GITHUB_SHA::8}" site/*.html
      # Every download button is written with the newest installer, so nobody edits a link after a release
      # (a release starts this publish through release-feeds.yml). If GitHub cannot be asked, the buttons keep the link
      # to the releases page and the last step of this job goes red.
      - name: Point the download buttons at the newest installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/site/download.py stamp site
      # The press page offers its files one by one and as one download.
      - name: Pack the press kit
        run: cd site/press && zip -qr riffhouse-press-kit.zip README.md logo screenshots && ls -la riffhouse-press-kit.zip
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # IndexNow: tells Bing and the search engines that share its list which pages to read again. ChatGPT and
      # Copilot search through Bing. The key is public by design: it is the file site/<key>.txt. Never fails the publish.
      - name: Tell search engines the site changed
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          key=0a74ae2ec02f570a4e4071be0260f348
          urls=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<loc>\(.*\)<\/loc>/"\1"/' | paste -sd, -)
          curl -sS -m 30 -o /dev/null -w 'IndexNow answered %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"riffhouse.in\",\"key\":\"$key\",\"keyLocation\":\"https://riffhouse.in/$key.txt\",\"urlList\":[$urls]}"
      # Reads the published pages back from riffhouse.in, follows every download button and fails if the file it
      # gives is not the newest release's installer.
      - name: The live download buttons give the newest installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/site/download.py check "${GITHUB_SHA::8}"
