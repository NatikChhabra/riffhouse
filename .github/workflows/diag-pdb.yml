name: Diag symbols
on:
  push:
    branches: ["diag/**"]
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-asiosdk
      - name: Configure
        shell: pwsh
        env:
          RIFFHOUSE_REPORT_URL: ${{ secrets.REPORT_URL }}
        run: |
          $sdk = (Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\include\asiosdk") -replace '\\','/'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DRIFFHOUSE_ASIO_SDK_DIR=$sdk" "-DRIFFHOUSE_VERSION_LABEL=0.1.5.1" -DRIFFHOUSE_BUILD_TESTS=OFF
      - run: cmake --build build --config Release --parallel --target Riffhouse_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: riffhouse-pdb
          path: |
            build/src/Riffhouse_artefacts/Release/Standalone/*.exe
            build/src/Riffhouse_artefacts/Release/Standalone/*.pdb
            build/**/Riffhouse*.pdb
